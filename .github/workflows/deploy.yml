name: Deploy to GitHub Pages

on:
  push:
    branches: [ marco ] # Ahora se ejecutará automáticamente cada vez que hagas push a 'marco'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          CI: false

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Si el build de Lovable genera '.output/public', cámbialo por ese path

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4